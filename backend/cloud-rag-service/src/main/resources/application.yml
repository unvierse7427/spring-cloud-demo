server:
  port: 8083

spring:
  application:
    name: cloud-rag-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://47.94.98.55:3306/project?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
  data:
    redis:
      host: ${REDIS_HOST:47.94.98.55}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
  servlet:
    multipart:
      # 知识库文档上传上限
      max-file-size: 50MB
      max-request-size: 50MB
  security:
    oauth2:
      resourceserver:
        jwt:
          # 与网关联用同一把公钥离线验签
          public-key-location: classpath:keys/public.pem
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:139.155.76.193:9876}
  producer:
    group: rag-ingest-producer
    send-message-timeout: 5000

cloud:
  rag:
    # 通义千问（DashScope）：Embedding 与 LLM
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      embedding-model: text-embedding-v2
      chat-model: qwen-plus
    llm:
      # qwen：通义千问；deepseek：DeepSeek（OpenAI 兼容接口）
      provider: ${RAG_LLM_PROVIDER:deepseek}
      deepseek:
        api-key: ${DEEPSEEK_API_KEY:}
        base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
        model-name: ${DEEPSEEK_MODEL:deepseek-chat}
    # 向量库 Qdrant（gRPC 端口默认 6334）
    qdrant:
      host: ${QDRANT_HOST:47.94.98.55}
      port: ${QDRANT_GRPC_PORT:6334}
      collection: ${QDRANT_COLLECTION:rag_chunks}
    # 文件存储 MinIO（9000 已被 cloud-auth-service 占用，这里改用 9002）
    minio:
      endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9002}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      bucket: ${MINIO_BUCKET:rag-documents}
    # 文档异步入库
    ingest:
      topic: rag-document-ingest
      consumer-group: rag-ingest-consumer
      # 子块：入向量库参与相似度计算，粒度小、语义集中
      chunk-size: 400
      chunk-overlap: 50
      # 父块：正文随子块一起入库，命中后作为 Prompt 输入，粒度大、上下文完整
      parent-chunk-size: 2000
      parent-chunk-overlap: 200
      # 假设问题：入库时为每个子块预生成若干条它能够回答的问题，作为额外检索入口
      hypothetical-questions:
        enabled: true
        count: 3
    # 图片 OCR：识别由 Python(PaddleOCR) 服务完成，这里经 MQ 异步调用
    ocr:
      base-url: ${OCR_BASE_URL:http://127.0.0.1:8100}
      # 图片体积上限（与 ocr-service/main.py 的 OCR_MAX_IMAGE_MB 保持一致）
      max-image-mb: ${OCR_MAX_IMAGE_MB:10}
      allowed-extensions: jpg,jpeg,png,bmp,webp
      topic: rag-ocr-request
      consumer-group: rag-ocr-consumer
      connect-timeout: 3000
      read-timeout: 60000
    # 检索问答
    query:
      default-top-k: 10
      min-score: 0.55
      # 带入提示词的历史问答轮数，保存在 Redis
      history-rounds: 3
      # 查询转换：检索前对用户问题做重写、回溯提示与子查询分解，再合并多个检索式的结果
      rewrite:
        enabled: true
        max-sub-queries: 3
        max-queries: 4
      # 系统提示词：只约束作答风格与格式，检索命中 / 未命中的差异由代码分支注入
      system-prompt: |
            你是严谨的知识库问答助手，只能依据上下文提供的知识库材料响应提问。
            
            输出规则：
            1. 全部使用中文作答，逻辑层次清楚；信息较多时使用分点表述。
            2. 最终回答文本中，不得出现资料编号、文档ID、引用序号等标记。
            3. 严格忠于知识库原文含义，不能篡改、引申、脑补没有依据的信息。
            4. 当知识库缺少相关内容，不足以回答问题时，直接说明暂无相关信息，禁止编造内容。
            5. 语言平实正式，聚焦问题本身，去除多余客套话，不主动拓展无关内容。
            6. 若用户问题模糊，可以简短询问用户补充信息，不强行作答。
            7. 不要输出markdown复杂样式，优先使用简单分点，保证可读性。
logging:
  level:
    com.example: debug
