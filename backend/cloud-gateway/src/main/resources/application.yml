server:
  port: 8080

spring:
  application:
    name: cloud-gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
    gateway:
      # 关闭基于服务名的自动路由，统一使用下方显式路由，避免路径被意外放行
      discovery:
        locator:
          enabled: false
          lower-case-service-id: true
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "*"
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600
      routes:
        # /api/auth/** -> cloud-auth-service 的 /auth/**
        - id: cloud-auth-service
          uri: lb://cloud-auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
        # /api/user/** -> cloud-user-service 的 /user/**
        - id: cloud-user-service
          uri: lb://cloud-user-service
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=1
        # /api/admin/** -> cloud-user-service 的 /admin/**（后台管理接口，仅 ROLE_ADMIN 可用）
        - id: cloud-admin-service
          uri: lb://cloud-user-service
          predicates:
            - Path=/api/admin/**
          filters:
            - StripPrefix=1
        # /api/chat/** -> cloud-chat-service 的 /chat/**（房间列表/创建、历史消息）
        - id: cloud-chat-service
          uri: lb://cloud-chat-service
          predicates:
            - Path=/api/chat/**
          filters:
            - StripPrefix=1
        # /ws/chat -> cloud-chat-service 内置 Netty WebSocket 服务（独立端口 9001）。
        # 注意：Nacos 中注册的是 HTTP 端口 8082，无法用 lb:ws:// 负载，故这里直连 Netty 端口。
        - id: cloud-chat-websocket
          uri: ${CHAT_WS_URI:ws://127.0.0.1:9001}
          predicates:
            - Path=/ws/chat
        # /api/rag/** -> cloud-rag-service 的 /kb/**（RAG 知识库：知识库管理、文档上传、检索问答）
        - id: cloud-rag-service
          uri: lb://cloud-rag-service
          predicates:
            - Path=/api/rag/**
          filters:
            - StripPrefix=2
        # 以下路由把各服务的 OpenAPI 描述文件收拢到网关，供 /swagger-ui.html 聚合页读取。
        # 统一走 /api-docs/{服务名}，避免与 springdoc 自身的 /v3/api-docs/{group} 冲突。
        - id: api-docs-auth
          uri: lb://cloud-auth-service
          predicates:
            - Path=/api-docs/auth
          filters:
            - RewritePath=/api-docs/auth, /v3/api-docs
        - id: api-docs-user
          uri: lb://cloud-user-service
          predicates:
            - Path=/api-docs/user
          filters:
            - RewritePath=/api-docs/user, /v3/api-docs
        - id: api-docs-chat
          uri: lb://cloud-chat-service
          predicates:
            - Path=/api-docs/chat
          filters:
            - RewritePath=/api-docs/chat, /v3/api-docs
        - id: api-docs-rag
          uri: lb://cloud-rag-service
          predicates:
            - Path=/api-docs/rag
          filters:
            - RewritePath=/api-docs/rag, /v3/api-docs
  security:
    oauth2:
      resourceserver:
        jwt:
          # 网关使用公钥离线验签，无需调用认证中心
          public-key-location: classpath:keys/public.pem

logging:
  level:
    com.example: debug

# 接口文档：网关只做聚合，页面与文档内容由各服务提供
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # 不展示网关自身的 OpenAPI，只展示下方聚合的各服务文档
    disable-swagger-default-url: true
    urls:
      - name: 认证中心 cloud-auth-service
        url: /api-docs/auth
      - name: 用户服务 cloud-user-service
        url: /api-docs/user
      - name: 聊天服务 cloud-chat-service
        url: /api-docs/chat
      - name: RAG 知识库 cloud-rag-service
        url: /api-docs/rag
